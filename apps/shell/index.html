<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/shell/favicon.svg?v=homeos2" />
    <title>HomeOS</title>
    <script>
      // Тема до первого рендера — без вспышки.
      try {
        const s = JSON.parse(localStorage.getItem('homeos.shell') || '{}').state || {}
        const t = s.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'warm')
        document.documentElement.dataset.theme = t
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
